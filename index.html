<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BS Muncher</title>
<style>
  body {
    background: #0a0a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Courier New', monospace;
    color: #e8e8e8;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #facc15;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  #subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 16px;
    text-align: center;
  }
  #gameWrapper {
    position: relative;
  }
  canvas {
    background: #111;
    border: 2px solid #facc15;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
    display: block;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 560px;
    margin-top: 10px;
    font-size: 16px;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    max-width: 86%;
    background: rgba(10, 10, 18, 0.95);
    border: 2px solid #facc15;
    border-radius: 6px;
    padding: 20px;
    box-sizing: border-box;
    color: #facc15;
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    display: none;
  }
  #instructions {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }
  button {
    margin-top: 10px;
    background: #facc15;
    border: none;
    padding: 8px 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    display: none;
  }
</style>
</head>
<body>
  <h1>🟡 BS MUNCHER 🟡</h1>
  <div id="subtitle">Swallow every piece of corporate nonsense before Logic, Truth, or Humanity catch up with you.</div>
  <div id="gameWrapper">
    <canvas id="game" width="560" height="560"></canvas>
    <div id="message"></div>
  </div>
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="lives">Lives: 3</span>
  </div>
  <div id="instructions">Arrow keys to move · Eat every "BS" pellet · Avoid Logic, Truth and Humanity</div>
  <button id="restartBtn">Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIZE = 35; // cell size
const COLS = 16, ROWS = 16;

// 1 = wall, 0 = open path with pellet, 2 = open path no pellet (spawn areas)
const mapLayout = [
"1111111111111111",
"1000000110000001",
"1010101110101101",
"1010100000000101",
"1010111011101101",
"1000000000000001",
"1110101101101011",
"1000101000001011",
"1011101011101011",
"1000001010000001",
"1010111010111101",
"1000000010111001",
"1110111010111011",
"1000001000000001",
"1011101111101101",
"1000000000000001",
];

let grid = [];
let pellets = [];

function buildGrid() {
  grid = [];
  pellets = [];
  for (let r = 0; r < ROWS; r++) {
    let row = [];
    for (let c = 0; c < COLS; c++) {
      const ch = mapLayout[r][c];
      row.push(ch === '1' ? 1 : 0);
      if (ch === '0') pellets.push({ r, c, eaten: false });
    }
    grid.push(row);
  }
}
buildGrid();

function isWall(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
  return grid[r][c] === 1;
}

const player = { r: 1, c: 1, dir: {r:0,c:0}, nextDir: {r:0,c:0} };

const ghostNames = ['Logic', 'Truth', 'Humanity'];
const ghostColors = ['#60a5fa', '#f87171', '#a78bfa'];
let ghosts = [];

function resetGhosts() {
  ghosts = [
    { r: 14, c: 14, color: ghostColors[0], name: ghostNames[0] },
    { r: 14, c: 1,  color: ghostColors[1], name: ghostNames[1] },
    { r: 1,  c: 14, color: ghostColors[2], name: ghostNames[2] },
  ];
}
resetGhosts();

let score = 0, lives = 3;
let gameOver = false, won = false;
let moveTimer = 0, ghostTimer = 0;
const MOVE_INTERVAL = 220;
const GHOST_INTERVAL = 340;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') player.nextDir = {r:-1,c:0};
  if (e.key === 'ArrowDown') player.nextDir = {r:1,c:0};
  if (e.key === 'ArrowLeft') player.nextDir = {r:0,c:-1};
  if (e.key === 'ArrowRight') player.nextDir = {r:0,c:1};
});

function tryMove(entity, dir) {
  const nr = entity.r + dir.r, nc = entity.c + dir.c;
  if (!isWall(nr, nc)) {
    entity.r = nr; entity.c = nc;
    return true;
  }
  return false;
}

function updatePlayer() {
  if (tryMove(player, player.nextDir)) {
    player.dir = player.nextDir;
  } else {
    tryMove(player, player.dir);
  }
  // eat pellet
  pellets.forEach(p => {
    if (!p.eaten && p.r === player.r && p.c === player.c) {
      p.eaten = true;
      score += 10;
    }
  });
  if (pellets.every(p => p.eaten) && !gameOver) {
    won = true;
    gameOver = true;
  }
}

function updateGhosts() {
  ghosts.forEach(g => {
    const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
    // simple chase: filter moves that reduce distance to player, fallback random
    let candidates = dirs.filter(d => !isWall(g.r + d.r, g.c + d.c));
    if (candidates.length === 0) return;
    candidates.sort((a, b) => {
      const da = Math.abs((g.r+a.r)-player.r) + Math.abs((g.c+a.c)-player.c);
      const db = Math.abs((g.r+b.r)-player.r) + Math.abs((g.c+b.c)-player.c);
      return da - db;
    });
    // mostly chase, occasionally random for less perfect AI
    const choice = Math.random() < 0.75 ? candidates[0] : candidates[Math.floor(Math.random()*candidates.length)];
    g.r += choice.r; g.c += choice.c;
  });

  ghosts.forEach(g => {
    if (g.r === player.r && g.c === player.c) {
      lives--;
      if (lives <= 0) {
        gameOver = true;
        won = false;
      } else {
        player.r = 1; player.c = 1; player.dir = {r:0,c:0}; player.nextDir = {r:0,c:0};
        resetGhosts();
      }
    }
  });
}

function drawCell(r, c, color) {
  ctx.fillStyle = color;
  ctx.fillRect(c * SIZE, r * SIZE, SIZE, SIZE);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // walls
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === 1) drawCell(r, c, '#1e293b');
    }
  }

  // pellets as "BS"
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  pellets.forEach(p => {
    if (!p.eaten) {
      ctx.fillText('BS', p.c * SIZE + SIZE/2, p.r * SIZE + SIZE/2 + 4);
    }
  });

  // player - original circular muncher, mouth animated by time
  const px = player.c * SIZE + SIZE/2;
  const py = player.r * SIZE + SIZE/2;
  const mouthOpen = (Math.floor(Date.now() / 150) % 2 === 0) ? 0.25 : 0.05;
  let angle = 0;
  if (player.dir.r === -1) angle = -Math.PI/2;
  else if (player.dir.r === 1) angle = Math.PI/2;
  else if (player.dir.c === -1) angle = Math.PI;
  else angle = 0;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(0, 0, SIZE/2 - 3, mouthOpen * Math.PI, (2 - mouthOpen) * Math.PI);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ghosts - original rounded-top, wavy-bottom shape with name labels
  ghosts.forEach(g => {
    const gx = g.c * SIZE + SIZE/2;
    const gy = g.r * SIZE + SIZE/2;
    const r = SIZE/2 - 4;
    ctx.fillStyle = g.color;
    ctx.beginPath();
    ctx.arc(gx, gy - 2, r, Math.PI, 0, false);
    ctx.lineTo(gx + r, gy + r);
    for (let i = 0; i < 3; i++) {
      const wx = gx + r - (i * (2*r/3)) - (r/3);
      ctx.lineTo(wx, gy + (i % 2 === 0 ? r - 6 : r));
    }
    ctx.lineTo(gx - r, gy + r);
    ctx.closePath();
    ctx.fill();

    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(gx - 5, gy - 4, 3, 0, Math.PI*2);
    ctx.arc(gx + 5, gy - 4, 3, 0, Math.PI*2);
    ctx.fill();

    // name label above
    ctx.fillStyle = g.color;
    ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(g.name, gx, gy - SIZE/2 - 4);
  });

  const msg = document.getElementById('message');
  const btn = document.getElementById('restartBtn');
  if (gameOver && won) {
    msg.style.display = 'block';
    msg.innerHTML = 'Congratulations! <br><br>You have successfully internalised our corporate values. These are fundamental to the company success.<br>A handshake is available upon request.<br><br> -> Go Further and reach the Archive folder for the Next steps.<br><br>May the ghosts of the outside world never catch up with you.<br><br>Final score: ' + score;
    btn.style.display = 'inline-block';
  } else if (gameOver) {
    msg.style.display = 'block';
    msg.innerHTML = 'Caught.<br><br>Logic, Truth or Humanity finally got to you.<br><br>Final score: ' + score;
    btn.style.display = 'inline-block';
  } else {
    msg.style.display = 'none';
    btn.style.display = 'none';
  }

  document.getElementById('score').textContent = 'Score: ' + score;
  document.getElementById('lives').textContent = 'Lives: ' + lives;
}

function loop(time) {
  if (!gameOver) {
    if (time - moveTimer > MOVE_INTERVAL) {
      updatePlayer();
      moveTimer = time;
    }
    if (time - ghostTimer > GHOST_INTERVAL) {
      updateGhosts();
      ghostTimer = time;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('restartBtn').addEventListener('click', () => {
  score = 0; lives = 3; gameOver = false; won = false;
  buildGrid();
  player.r = 1; player.c = 1; player.dir = {r:0,c:0}; player.nextDir = {r:0,c:0};
  resetGhosts();
});
</script>
</body>
</html>
